<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f8f9fa; --fg: #18181b; --card: #ffffff;
    --accent: #005A36; --accent2: #EABF0E;
    --border: #e2e8f0; --muted: #64748b;
    --radius: 10px; --font: system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117; --fg: #e2e8f0; --card: #1a1d27;
      --border: #2d3748; --muted: #94a3b8; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1117; --fg: #e2e8f0; --card: #1a1d27;
    --border: #2d3748; --muted: #94a3b8; color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--fg); font-size: 15px; line-height: 1.6; }
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 230px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border); padding: 24px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .sidebar-title { padding: 0 20px 16px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .nav-item { display: block; padding: 8px 20px; font-size: 13.5px; color: var(--fg); text-decoration: none; border-left: 3px solid transparent; cursor: pointer; }
  .nav-item:hover, .nav-item.active { background: color-mix(in srgb, var(--accent) 8%, transparent); border-left-color: var(--accent); color: var(--accent); font-weight: 600; }
  .main { flex: 1; padding: 36px 40px; max-width: 900px; }
  .page-header { margin-bottom: 32px; padding-bottom: 20px; border-bottom: 2px solid var(--accent2); }
  .page-header h1 { font-size: 26px; font-weight: 800; color: var(--accent); }
  .page-header p { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
  .section { display: none; }
  .section.active { display: block; }
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .item-label { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .item-content { font-size: 14px; color: var(--fg); }
  .item-code { background: #0f172a; color: #e2e8f0; font-family: monospace; font-size: 13px; padding: 10px 14px; border-radius: 6px; margin-top: 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  .item-note { font-size: 12.5px; color: var(--muted); margin-top: 8px; padding-left: 10px; border-left: 3px solid var(--accent2); }
  @media (max-width: 600px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); }
    .main { padding: 20px 16px; }
  }
</style>

<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="page-header" id="pageHeader"></div>
    <div id="content"></div>
  </main>
</div>

<script>
(function() {
  const raw = document.getElementById('doc-data');
  if (!raw) return;
  const d = JSON.parse(raw.textContent);
  const m = d.meta || {};
  document.title = m.title || 'Document';
  document.getElementById('pageHeader').innerHTML =
    `<h1>${m.title || ''}</h1>` +
    (m.subtitle ? `<p>${m.subtitle}</p>` : '') +
    (m.version ? `<p style="font-size:12px;margin-top:4px;color:var(--muted);">v${m.version}${m.updated ? ' · Cập nhật: ' + m.updated : ''}${m.project ? ' · ' + m.project : ''}</p>` : '');
  const sidebar = document.getElementById('sidebar');
  const content = document.getElementById('content');
  sidebar.innerHTML = '<div class="sidebar-title">Nội dung</div>' +
    (d.sections || []).map((s, i) =>
      `<span class="nav-item${i===0?' active':''}" data-idx="${i}">${s.icon||''} ${s.title}</span>`
    ).join('');
  content.innerHTML = (d.sections || []).map((s, i) =>
    `<div class="section${i===0?' active':''}" data-idx="${i}">
      <div class="section-title">${s.icon||''} ${s.title}</div>
      ${(s.items||[]).map(it =>
        `<div class="item">
          <div class="item-label">${it.label}</div>
          <div class="item-content">${it.content || ''}</div>
          ${it.code ? `<div class="item-code">${it.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>` : ''}
          ${it.note ? `<div class="item-note">${it.note}</div>` : ''}
        </div>`
      ).join('')}
    </div>`
  ).join('');
  sidebar.addEventListener('click', e => {
    const t = e.target.closest('.nav-item');
    if (!t) return;
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.section').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    content.querySelector(`.section[data-idx="${t.dataset.idx}"]`).classList.add('active');
  });
})();
</script>
