name: Deploy to Matbao

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.*
            docker-compose.yml
            scripts/test_*.mjs
            node_modules/**

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://nhakhoakimdung.vn/api/v1/services)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "Health check failed: got $STATUS" && exit 1)
