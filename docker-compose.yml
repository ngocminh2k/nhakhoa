version: '3.9'

# -------------------------------------------------------
# Nha Khoa Kim Dung — Local Dev Stack
# Usage:
#   1. docker compose up -d
#   2. Mở http://localhost:8080/install   (chạy 1 lần để tạo DB)
#   3. Test API:  curl http://localhost:8080/api/v1/services
#   4. Admin:     http://localhost:8080/admin/
# -------------------------------------------------------

services:
  db:
    image: mariadb:11
    container_name: nhakhoa_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: nhakhoa_db
      MARIADB_USER: nhakhoa_user
      MARIADB_PASSWORD: nhakhoa_pass
    ports:
      - "3306:3306"
    volumes:
      - nhakhoa_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    # webdevops/php-apache ships PHP 8.2 + pdo_mysql + curl + openssl + apache mod_rewrite
    # — matches Mắt Bão LiteSpeed environment closely enough for integration testing
    image: webdevops/php-apache:8.2
    container_name: nhakhoa_web
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      WEB_DOCUMENT_ROOT: /app
      APP_ENV: development
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: nhakhoa_db
      DB_USER: nhakhoa_user
      DB_PASS: nhakhoa_pass
      GOOGLE_SHEETS_ENABLED: "false"
      AUTOMATION_API_KEY: kd_dev_test_key_abc123
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  nhakhoa_data:
